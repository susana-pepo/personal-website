    <!-- painted by scripts/build-social-preview.py; absolute, as most link previews ignore relative paths -->
    <meta property="og:image" content="https://susanapepo.com/social-preview.jpg" />
    <meta property="og:image:width" content="2560" />
    <meta property="og:image:height" content="1280" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=record" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=record" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=record" />
    <link rel="preload" as="image" href="/media/scene/room.webp" type="image/webp" fetchpriority="high" />
    <script>
      // Start fetching the window view the visitor's clock will show (and the glass
      // mask it's drawn through) before the app loads. Dawn needs nothing: the
      // painting shows it. Hours and paths as in src/scene/windowViews.ts
      // (TIME_STARTS) and window-views.json; a test keeps them in step.
      ;(function () {
        var h = new Date().getHours()
        var t = h >= 18 || h < 5 ? 'night' : h >= 11 ? 'midday' : 'dawn'
        if (t === 'dawn') return
        ;['/media/scene/window-views/' + t + '-still.webp', '/media/scene/window-views/view-mask.png'].forEach(function (href) {
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.href = href
          link.setAttribute('fetchpriority', 'high')
          document.head.appendChild(link)
        })
      })()
    </script>
    <style>
      /* the page's own dark background from the very first frame (no white flash before the CSS) */
      html { background: oklch(0.165 0.008 45); color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: Georgia, serif; color: #f4e9d8; background: #1a1310; padding: 2rem; margin: 0">
        Susana Pérez Posada · Product, Music & Technology. This site needs JavaScript to open its illustrated room.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
