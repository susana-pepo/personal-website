<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Glimmer mock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,700&display=swap" rel="stylesheet" />
<style>
  /*
   * Glimmers speak in moonlight: one soft blue that nothing else in the room uses
   * (sections breathe amber, the record player is vermilion). Same calm curves and pace
   * as the room's own motion: blur-in floats like her greeting, slow breaths like the halos.
   */
  :root {
    --moon: oklch(0.9 0.05 235);
    --moon-deep: oklch(0.76 0.09 240);
    --moon-bloom: oklch(0.78 0.1 240 / 0.55);
    --edge: oklch(0.2 0.03 45 / 0.4);
    --drift: cubic-bezier(0.33, 0, 0.2, 1);
    --sine: cubic-bezier(0.45, 0, 0.55, 1);
    --cycle: 9s;
  }
  html, body { margin: 0; background: #17120f; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 1440px; height: 900px; border: 0; }
  .layer { position: absolute; inset: 0; width: 1440px; height: 900px; pointer-events: none; }

  /* ── Cat: three z's drift up out of its sleep, each one larger, in moonlight ── */
  .zs { position: absolute; left: 1122px; top: 552px; }
  .z {
    position: absolute; left: 0; bottom: 0;
    font: 700 20px/1 'DM Sans', system-ui, sans-serif;
    letter-spacing: 0.01em;
    color: var(--moon);
    text-shadow: 0 0 0.45em var(--moon-bloom), 0 1px 2px var(--edge);
    opacity: 0;
    animation: z-drift var(--cycle) var(--drift) infinite;
  }
  .z:nth-child(1) { --s: 0.9;  --x0: 0px;  --y0: 0px;   --x1: 16px; --y1: -40px;  }
  .z:nth-child(2) { --s: 1.15; --x0: 14px; --y0: -22px; --x1: 34px; --y1: -68px;  animation-delay: 0.7s; }
  .z:nth-child(3) { --s: 1.45; --x0: 30px; --y0: -40px; --x1: 56px; --y1: -100px;  animation-delay: 1.4s; }
  /* like her greeting: it arrives out of a blur, rising, and from then on fades as it floats; never held */
  @keyframes z-drift {
    0%   { opacity: 0;    filter: blur(3px); transform: translate(var(--x0), var(--y0)) rotate(-6deg) scale(calc(var(--s) * 0.85)); }
    6%   { opacity: 0.95; filter: blur(0);   }
    20%  { opacity: 0.8;  transform: translate(calc((var(--x0) + var(--x1)) / 2 - 4px), calc((var(--y0) + var(--y1)) / 2)) rotate(2deg) scale(var(--s)); }
    36%  { opacity: 0;    filter: blur(1.5px); transform: translate(var(--x1), var(--y1)) rotate(8deg) scale(var(--s)); }
    100% { opacity: 0;    transform: translate(var(--x1), var(--y1)) rotate(8deg) scale(var(--s)); }
  }

  /* ── Lamp: half a cycle later, its bulb catches (a flick off and back, as if a switch
        had been touched) and moonlight glints run round the brass rim ── */
  .lamp { position: absolute; inset: 0; }
  .lamp > * { animation-delay: calc(var(--cycle) / 2) !important; }
  .dim {
    position: absolute; left: 700px; top: 412px; width: 120px; height: 86px; border-radius: 50%;
    background: radial-gradient(closest-side, oklch(0.25 0.04 60 / 0.75), transparent);
    mix-blend-mode: multiply; opacity: 0;
    animation: flick var(--cycle) var(--sine) infinite;
  }
  /* off, back, a softer off, back: a click you can almost hear */
  @keyframes flick {
    0%, 100% { opacity: 0 }
    2%  { opacity: 0.9 }
    4%  { opacity: 0 }
    7%  { opacity: 0.55 }
    10% { opacity: 0 }
  }
  .glint {
    position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px;
    opacity: 0;
    filter: drop-shadow(0 0 5px var(--moon-bloom));
    animation: glint var(--cycle) var(--sine) infinite;
  }
  .glint::before, .glint::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 100%; height: 2.5px; margin: -1.25px 0 0 -50%; border-radius: 2px;
    background: linear-gradient(to right, transparent, var(--moon) 40% 60%, transparent);
  }
  .glint::after { transform: rotate(90deg); }
  .glint i {
    position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%;
    background: oklch(0.97 0.025 235);
  }
  .g1 { left: 804px; top: 438px; --size: 1.15; }
  .g2 { left: 786px; top: 390px; --size: 0.75;  animation-delay: calc(var(--cycle) / 2 + 0.35s) !important; }
  .g3 { left: 760px; top: 360px; --size: 0.55;  animation-delay: calc(var(--cycle) / 2 + 0.65s) !important; }
  @keyframes glint {
    0%   { opacity: 0; transform: rotate(-30deg) scale(0); }
    5%   { opacity: 1; transform: rotate(0deg) scale(var(--size)); }
    12%  { opacity: 0.85; transform: rotate(20deg) scale(calc(var(--size) * 0.9)); }
    22%  { opacity: 0; transform: rotate(45deg) scale(calc(var(--size) * 0.4)); }
    100% { opacity: 0; transform: rotate(45deg) scale(0); }
  }

  .note { position: absolute; left: 16px; bottom: 12px; color: oklch(0.85 0.02 80 / 0.7); font: 12px/1.4 system-ui; }
</style>
</head>
<body>
  <iframe src="http://localhost:5173/" title="room"></iframe>
  <div class="layer" aria-hidden="true">
    <div class="zs"><span class="z">z</span><span class="z">z</span><span class="z">z</span></div>
    <div class="lamp">
      <span class="dim"></span>
      <span class="glint g1"><i></i></span>
      <span class="glint g2"><i></i></span>
      <span class="glint g3"><i></i></span>
    </div>
  </div>
  <p class="note">Mock: the cat, then the lamp, half a cycle apart (9s cycle).</p>
  <script>
    const t = new URLSearchParams(location.search).get('t')
    if (t !== null) setTimeout(() => document.getAnimations().forEach(a => { a.pause(); a.currentTime = +t }), 16000)
  </script>
</body>
</html>
