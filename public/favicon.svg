  <circle cx="32" cy="32" r="15" fill="none" stroke="#ECE9E4" stroke-opacity=".14"/>
  <circle cx="32" cy="32" r="9.5" fill="#E4673F"/>
  <circle cx="32" cy="32" r="1.8" fill="#ECE9E4"/>
</svg>
